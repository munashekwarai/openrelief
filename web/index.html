<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123c35"><link rel="manifest" href="/manifest.webmanifest"><title>OpenRelief Field Desk</title><style>
:root{font-family:Inter,system-ui,sans-serif;color:#17352f;background:#f2f0e8}body{margin:0}.shell{max-width:980px;margin:auto;padding:32px 20px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900;font-size:1.35rem}.status{padding:8px 13px;border-radius:99px;background:#dce8df}.status.offline{background:#f8d7c5;color:#842e14}.hero{margin:55px 0 30px}.hero h1{font:800 clamp(2.6rem,7vw,5.7rem)/.92 Georgia,serif;margin:0;letter-spacing:-.05em}.hero p{max-width:590px;font-size:1.1rem;color:#547069}.grid{display:grid;grid-template-columns:1.25fr .75fr;gap:18px}.panel{background:#fff;border:1px solid #d7ddd6;border-radius:18px;padding:24px;box-shadow:0 14px 40px #17352f0c}label{display:block;font-size:.8rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;margin:18px 0 7px}input,select,textarea{box-sizing:border-box;width:100%;padding:13px;border:1px solid #b9c6be;border-radius:9px;font:inherit}button{margin-top:20px;padding:13px 18px;border:0;border-radius:9px;background:#123c35;color:white;font-weight:800;cursor:pointer}.metric{font-size:2.4rem;font-weight:900;margin:8px 0}.muted{color:#6b7f79}.queue-item{border-top:1px solid #e7ebe7;padding:12px 0}.conflict{color:#9a3412}@media(max-width:720px){.grid{grid-template-columns:1fr}.hero{margin-top:35px}}
</style></head><body><main class="shell"><header class="top"><div class="brand">OPENRELIEF / FIELD DESK</div><div id="status" class="status">Checking connection</div></header><section class="hero"><h1>Work does not stop<br>when the network does.</h1><p>Capture validated field assessments locally, inspect the queue, and synchronize deliberately when connectivity returns.</p></section><section class="grid"><article class="panel"><h2>New field assessment</h2><form id="form"><label>Location</label><input name="location" required maxlength="120"><label>Priority</label><select name="priority"><option>LOW</option><option>MEDIUM</option><option>HIGH</option></select><label>Observed needs</label><textarea name="needs" required maxlength="1000" rows="5"></textarea><button>Save securely on this device</button></form><p id="message" class="muted"></p></article><aside class="panel"><div class="muted">Pending synchronization</div><div id="pending" class="metric">0</div><button id="sync" type="button">Synchronize now</button><h3>Local queue</h3><div id="queue" class="muted">No pending records</div></aside></section></main><script type="module" src="/app.js"></script></body></html>
